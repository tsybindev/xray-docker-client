version: "3.8"

services:
  # Пример 1: Proxy Gateway (рекомендуемый) — через общую сеть и переменные окружения
  my-app-via-proxy:
    image: alpine:latest
    networks:
      - vpn_net
    environment:
      - http_proxy=socks5h://xray-client:10808
      - https_proxy=socks5h://xray-client:10808
      - NO_PROXY=localhost,127.0.0.1,.local
    command: ash -c "apk add -q curl && sleep 3 && curl -s ifconfig.me && echo"
    depends_on:
      xray-client:
        condition: service_started

networks:
  vpn_net:
    external: true
    name: vpn_network
